services:
  figlet:
    build: .
    image: figlet:latest
    container_name: figlet
    restart: unless-stopped
    ports:
      - '127.0.0.1:3400:3400'
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3400
      CACHE_DB: /app/data/cache.sqlite
    volumes:
      - figlet-data:/app/data
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
volumes:
  figlet-data:
