name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Use Ubuntu repositories for Playwright system dependencies
        run: |
          # Playwright downloads its own Chromium. An unrelated Chrome apt mirror
          # must not block installing Ubuntu libraries when that mirror is out of sync.
          sudo python3 - <<'PY'
          from pathlib import Path
          for source in Path('/etc/apt/sources.list.d').iterdir():
              if source.suffix in ('.list', '.sources') and 'dl.google.com/linux/chrome' in source.read_text():
                  source.rename(source.with_suffix(source.suffix + '.disabled'))
          PY
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Main only, after the full check: pull on the server, rebuild, roll out,
  # then wait for the health endpoint. The dedicated read-only deploy key lives
  # in the FIGLET_DEPLOY_KEY secret; /opt/figlet pulls via public HTTPS.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: figlet-production
      cancel-in-progress: false
    steps:
      - name: Deploy to nocturna
        run: |
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.FIGLET_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H nocturna.ru >> ~/.ssh/known_hosts
          ssh ubuntu@nocturna.ru 'set -e
            cd /opt/figlet
            git pull --ff-only origin main
            sudo docker compose build --pull
            sudo docker compose up -d'
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            code=$(ssh ubuntu@nocturna.ru 'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3400/api/health' || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          exit 1
